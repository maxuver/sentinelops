# SentinelOps Helm values. Defaults target a local kind cluster with images
# side-loaded via `kind load docker-image`.

images:
  ingest: sentinelops/ingest-api:dev
  analyzer: sentinelops/analyzer-worker:dev
  pullPolicy: IfNotPresent

redis:
  image: redis:7-alpine

# Incident history. Enabled by setting config.store=postgres.
# Set deploy=false to use an existing/managed database instead — then the DSN is
# read from the so-postgres-dsn Secret (see deploy/README.md).
postgres:
  deploy: true
  image: postgres:16-alpine
  user: sentinel
  database: sentinelops
  password: sentinel # demo default; override in any real deployment
  storage: 2Gi

# Runtime configuration (SENTINELOPS_* env). Safe offline defaults: the stub
# backend needs no API key, and the k8s-events collector reads live cluster
# events. Switch llmProvider to "anthropic" (+ apiKeySecret) or "ollama", and
# add "prometheus,loki" to collectors, per environment.
config:
  logLevel: INFO
  llmProvider: stub
  collectors: k8s-events
  notifier: stub
  # memory | postgres. postgres stores the incident history (redacted only).
  store: memory
  prometheusUrl: http://localhost:9090
  lokiUrl: http://localhost:3100
  # Chat that receives incidents when notifier=telegram. The bot token is NOT
  # here: it lives in a Secret (see deploy/README.md), never in values.
  telegramChatId: ""

# Read-only RBAC for the analyzer's Kubernetes-events collector.
# clusterWide=true grants get/list/watch on events across all namespaces
# (events only, read-only). Set false to restrict to the release namespace.
rbac:
  clusterWide: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
