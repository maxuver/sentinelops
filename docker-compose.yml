services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest-api:
    build: services/ingest-api
    environment:
      SENTINELOPS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  analyzer-worker:
    build: services/analyzer-worker
    environment:
      SENTINELOPS_REDIS_URL: redis://redis:6379/0
      # stub backend by default → runs offline with no API key or model server.
      # Set to "anthropic" (+ ANTHROPIC_API_KEY) or "ollama" for real analysis.
      SENTINELOPS_LLM_PROVIDER: stub
      SENTINELOPS_NOTIFIER: stub
    depends_on:
      redis:
        condition: service_healthy
