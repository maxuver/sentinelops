apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ingest-api
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ingest-api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingest-api
    spec:
      containers:
        - name: ingest-api
          image: {{ .Values.images.ingest }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ingest-api
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: ingest-api
  ports:
    - port: 8080
      targetPort: 8080
