services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelops"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest-api:
    build: services/ingest-api
    environment:
      SENTINELOPS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  analyzer-worker:
    build: services/analyzer-worker
    environment:
      SENTINELOPS_REDIS_URL: redis://redis:6379/0
      # stub backend by default → runs offline with no API key or model server.
      # Set to "anthropic" (+ ANTHROPIC_API_KEY) or "ollama" for real analysis.
      SENTINELOPS_LLM_PROVIDER: stub
      SENTINELOPS_NOTIFIER: stub
      SENTINELOPS_STORE: postgres
      SENTINELOPS_POSTGRES_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinelops
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web-ui:
    build: services/web-ui
    environment:
      SENTINELOPS_POSTGRES_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinelops
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
